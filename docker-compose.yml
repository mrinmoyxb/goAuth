services:
  postgres:
    image: postgres:17
    container_name: auth_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goAuth_db
    ports:
      - "5427:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7
    container_name: goauth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: